name: sfms

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sfms}
      POSTGRES_USER: ${POSTGRES_USER:-sfms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sfms}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sfms}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"   # console

  # Create the default bucket on startup.
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin}; do sleep 1; done;
      mc mb --ignore-existing local/${MINIO_BUCKET:-sfms-media};
      mc anonymous set download local/${MINIO_BUCKET:-sfms-media} || true;
      "

  backend:
    build: ./backend
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --reload
    env_file: .env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      minio:
        condition: service_started

  worker:
    build: ./backend
    command: celery -A config worker -l info
    env_file: .env
    environment:
      RUN_MIGRATIONS: "0"
    volumes:
      - ./backend:/app
    depends_on:
      - backend
      - rabbitmq
      - redis

  beat:
    build: ./backend
    command: celery -A config beat -l info
    env_file: .env
    environment:
      RUN_MIGRATIONS: "0"
    volumes:
      - ./backend:/app
    depends_on:
      - backend
      - rabbitmq

  frontend:
    build: ./frontend
    command: npm run dev -- --host
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

  # Reverse proxy — serves the built SPA (frontend/dist) for yukicares.cloud +
  # every *.yukicares.cloud subdomain, and routes /api /admin /health /static to
  # the backend. Build the frontend first so ./frontend/dist exists:
  #   docker compose run --rm frontend npm run build
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      # - "443:443"   # enable when you add the wildcard TLS cert
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./docs-build:/usr/share/nginx/docs:ro   # Docusaurus static docs (/docs/)
      # - ./nginx/certs:/etc/nginx/certs:ro   # wildcard cert for HTTPS
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
