# Reverse proxy for YukiCares.
#
# - Serves the built React SPA (frontend/dist) for the apex domain AND every
#   school subdomain (*.yukicares.cloud).
# - Routes Django API / admin / health / static requests to the backend,
#   passing the ORIGINAL Host header through so django-tenants can resolve the
#   correct school from the subdomain.
#
# HTTP only for now. For HTTPS you need a wildcard certificate for
# *.yukicares.cloud (Let's Encrypt DNS-01 challenge) — see the commented 443
# block at the bottom of this file.

upstream backend {
    server backend:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name yukicares.cloud *.yukicares.cloud;

    # Allow reasonably large uploads (student photos, logos, bulk imports).
    client_max_body_size 25m;

    # The built SPA (frontend/dist) is mounted here.
    root /usr/share/nginx/html;
    index index.html;

    # --- Django backend (API, admin, health check, WhiteNoise static) ---
    location ~ ^/(api|admin|health|static)/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;   # keep subdomain for tenancy
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Uploaded media (student/teacher photos, school logos, docs) from MinIO.
    # MinIO isn't publicly exposed, so nginx proxies the bucket path to it.
    location /sfms-media/ {
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets never change — cache them hard (at the browser + CDN).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # --- React SPA (everything else) with client-side routing fallback ---
    # index.html / the SW must not be cached, or a redeploy serves a stale app
    # that points at deleted asset hashes.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

